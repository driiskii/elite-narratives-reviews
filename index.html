<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Elite Narratives Reviews</title>


  <style>

 * {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 50px 20px;
  font-family: Arial, sans-serif;
  background: transparent;
  color: #000;
}

#reviews-section {
  max-width: 1100px;
  margin: 0 auto;
  text-align: center;
}

/* ============================
   MAIN HEADING
   ============================ */

#reviews-section > h2 {
  margin: 0 0 32px;
  font-size: 38px;
  line-height: 1.2;
  font-weight: 700;
  color: #000;
}

/* ============================
   RATING SUMMARY
   ============================ */

#rating-summary {
  margin-bottom: 42px;
}

#average-rating {
  font-size: 54px;
  line-height: 1;
  font-weight: 800;
  color: #000;
  margin-bottom: 10px;
}

#average-stars {
  font-size: 30px;
  line-height: 1.2;
  margin-bottom: 7px;
}

.rating-stars {
  color: #8436FD;
  letter-spacing: 3px;
}

.rating-number {
  display: none;
}

#review-count {
  margin-top: 8px;
  font-size: 15px;
  color: #000;
  opacity: 0.6;
}

/* ============================
   REVIEW CARDS
   ============================ */

#reviews-list {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 18px;
  width: 100%;
  text-align: left;
}

.review-card {
  padding: 24px 20px;
  border: 1px solid rgba(132, 54, 253, 0.14);
  border-radius: 20px;
  background: #fff;
  box-shadow: 0 7px 24px rgba(0, 0, 0, 0.055);
  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.review-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 11px 28px rgba(132, 54, 253, 0.12);
}

.review-stars {
  color: #8436FD;
  font-size: 21px;
  letter-spacing: 2px;
  margin-bottom: 13px;
}

.review-text {
  font-size: 17px;
  line-height: 1.6;
  color: #000;
  margin: 0 0 18px;
}

.review-name {
  color: #000;
  font-weight: 700;
  margin: 0;
}

.review-date {
  color: #000;
  font-size: 13px;
  opacity: 0.5;
  margin-top: 5px;
  margin-bottom: 0;
}

/* ============================
   REVIEW FORM
   ============================ */
#review-form {
  display: grid;
  grid-template-columns: 1.1fr 1fr 1.5fr 1.1fr;
  gap: 18px;
  align-items: end;
}

#review-form-section h2 {
  text-align: center;
  margin: 0 0 25px;
  font-size: 30px;
  color: #000;
}

#review-form .form-field {
  margin-bottom: 0;
}

#review-form .form-field label {
  white-space: nowrap;
}

    #review-form .form-field textarea {
  min-height: 48px;
  height: 48px;
  resize: none;
}
#review-form-section {
  width: 100%;
  max-width: 1100px;
  margin: 60px auto 15px;
  padding: 32px 40px;
  text-align: left;
  border-radius: 24px;
  background: #fff;
  border: 1px solid rgba(132, 54, 253, 0.16);
  box-shadow: 0 9px 30px rgba(0, 0, 0, 0.06);
}
#review-form-section h2 {
  text-align: center;
  margin: 0 0 28px;
  font-size: 30px;
  color: #000;
}

/* ============================
   FORM FIELDS
   ============================ */

.form-field {
  margin-bottom: 20px;
}

.form-field label {
  display: block;
  margin-bottom: 8px;
  font-weight: 700;
  color: #000;
}

.form-field label span {
  font-weight: normal;
  opacity: 0.55;
}

.form-field input,
.form-field textarea {
  width: 100%;
  padding: 13px 15px;
  border: 1px solid #d8d8d8;
  border-radius: 11px;
  font-family: inherit;
  font-size: 16px;
  color: #000;
  background: #fff;
  outline: none;
  transition:
    border-color 0.2s ease,
    box-shadow 0.2s ease;
}

.form-field input:focus,
.form-field textarea:focus {
  border-color: #8436FD;
  box-shadow: 0 0 0 3px rgba(132, 54, 253, 0.11);
}

.form-field textarea {
  min-height: 135px;
  resize: vertical;
}

/* ============================
   STAR SELECTOR
   ============================ */

#star-rating {
  display: flex;
  gap: 6px;
}

#star-rating span {
  font-size: 38px;
  line-height: 1;
  color: #d3d3d3;
  cursor: pointer;
  transition:
    color 0.15s ease,
    transform 0.15s ease;
}

#star-rating span:hover {
  transform: scale(1.08);
}

#star-rating span.selected,
#star-rating span.hover {
  color: #8436FD;
}

/* ============================
   SUBMIT BUTTON
   ============================ */

#submit-review {
  grid-column: 1 / -1;
  justify-self: center;
  width: 220px;
  padding: 13px 20px;
  border: 2px solid #000;
  border-radius: 11px;
  background: #000;
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition:
    background 0.2s ease,
    border-color 0.2s ease,
    transform 0.2s ease;
}
#submit-review:hover {
  background: #8436FD;
  border-color: #8436FD;
  transform: translateY(-1px);
}

#submit-review:disabled {
  opacity: 0.6;
  cursor: wait;
  transform: none;
}

/* ============================
   FORM MESSAGE
   ============================ */

#review-message {
  margin-top: 15px;
  text-align: center;
  font-weight: 600;
  color: #000;
}

/* ============================
   MOBILE
   ============================ */

@media (max-width: 700px) {

  body {
    padding: 35px 15px;
  }

  #reviews-section > h2 {
    font-size: 30px;
    margin-bottom: 27px;
  }

  #average-rating {
    font-size: 46px;
  }

  #average-stars {
    font-size: 27px;
  }

  #reviews-list {
    grid-template-columns: 1fr;
    gap: 18px;
  }

  .review-card {
    padding: 24px;
    border-radius: 18px;
  }

  .review-text {
    font-size: 16px;
  }

  #review-form-section {
    margin-top: 52px;
    padding: 30px 20px;
    border-radius: 20px;
  }

  #review-form-section h2 {
    font-size: 27px;
  }

  #star-rating span {
    font-size: 34px;
  }

  #review-form {
  grid-template-columns: 1fr;
  gap: 18px;
}

#review-form .form-field {
  margin-bottom: 0;
}

#review-form .form-field textarea {
  height: 120px;
}

#submit-review {
  width: 100%;
}
}
  </style>

</head>


<body>

  <!-- ============================
       REVIEWS
       ============================ -->

  <div id="reviews-section">

    <h2>
      What People Are Saying
    </h2>

    <div id="rating-summary">

      <div id="average-rating">
        0.0
      </div>

      <div id="average-stars">
        ☆☆☆☆☆
      </div>

      <div id="review-count">
        Based on 0 reviews
      </div>

    </div>


    <div id="reviews-list">
      Loading reviews...
    </div>

  </div>


  <!-- ============================
       REVIEW FORM
       ============================ -->

  <div id="review-form-section">

    <h2>Leave a Review</h2>

    <div id="review-form">

      <div class="form-field">

        <label for="review-name">
          Your Name
        </label>

        <input
          type="text"
          id="review-name"
          placeholder="Your name"
        >

      </div>


      <div class="form-field">

        <label>
          Your Rating
        </label>

        <div id="star-rating">

          <span data-rating="1">★</span>
          <span data-rating="2">★</span>
          <span data-rating="3">★</span>
          <span data-rating="4">★</span>
          <span data-rating="5">★</span>

        </div>

      </div>


      <div class="form-field">

        <label for="review-text">
          Your Review
        </label>

        <textarea
          id="review-text"
          placeholder="Tell us about your experience..."
        ></textarea>

      </div>


      <div class="form-field">

        <label for="review-email">
          Email
          <span>(optional)</span>
        </label>

        <input
          type="email"
          id="review-email"
          placeholder="you@example.com"
        >

      </div>


      <button
        id="submit-review"
        type="button"
      >
        Submit Review
      </button>


      <div id="review-message"></div>

    </div>

  </div>


  <!-- ============================
       JAVASCRIPT
       ============================ -->

  <script>

    const REVIEWS_URL =
      "https://script.google.com/macros/s/AKfycbw9nRXba6kYjTGUaZLxgScZ0ADz5iFiWa8YkKV0oB3xdM6sv8oZ1INmYWcmbRe2kxLk/exec";


    /* ============================
       DISPLAY REVIEWS
       ============================ */

    function displayReviews(data) {

      const reviewsList =
        document.getElementById("reviews-list");

      const averageRating =
        document.getElementById("average-rating");

      const averageStars =
        document.getElementById("average-stars");

      const reviewCount =
        document.getElementById("review-count");


      if (!data.success) {

        reviewsList.textContent =
          "Unable to load reviews.";

        return;

      }


      const reviews =
        data.reviews || [];


      if (reviews.length === 0) {

        averageRating.textContent = "0.0";

        averageStars.textContent =
          "☆☆☆☆☆";

        reviewCount.textContent =
          "Based on 0 reviews";

        reviewsList.textContent =
          "No reviews yet.";

        return;

      }


      /* Calculate average */

      const totalRating =
        reviews.reduce(
          (total, review) =>
            total + Number(review.rating),
          0
        );


      const average =
        totalRating / reviews.length;


      /* Display summary */

      averageRating.textContent =
        average.toFixed(1);


      averageStars.innerHTML =
        '<span class="rating-stars">★★★★★</span> ' +
        '<span class="rating-number">' +
        average.toFixed(1) +
        '</span>';


      reviewCount.textContent =
        `Based on ${reviews.length} ${
          reviews.length === 1
            ? "review"
            : "reviews"
        }`;


      /* Display review cards */

      reviewsList.innerHTML = "";


      reviews.forEach(review => {

        const reviewCard =
          document.createElement("div");


        reviewCard.className =
          "review-card";


        let formattedDate = "";


        if (review.timestamp) {

          const reviewDate =
            new Date(review.timestamp);


          if (
            !isNaN(reviewDate.getTime())
          ) {

            formattedDate =
              reviewDate.toLocaleDateString(
                "en-US",
                {
                  year: "numeric",
                  month: "long",
                  day: "numeric"
                }
              );

          }

        }


        reviewCard.innerHTML = `

          <div class="review-stars">

            ${"★".repeat(
              Number(review.rating)
            )}

            ${"☆".repeat(
              5 - Number(review.rating)
            )}

          </div>


          <p class="review-text">
            "${review.review}"
          </p>


          <p class="review-name">
            — ${review.name}
          </p>


          <p class="review-date">
            ${formattedDate}
          </p>

        `;


        reviewsList.appendChild(
          reviewCard
        );

      });

    }


    /* ============================
       LOAD REVIEWS
       ============================ */

    function loadReviews() {

      const callbackName =
        "reviewsCallback_" + Date.now();


      window[callbackName] =
        function(data) {

          displayReviews(data);

          delete window[callbackName];

        };


      const script =
        document.createElement("script");


      script.src =
        REVIEWS_URL +
        "?callback=" +
        callbackName;


      script.onerror =
        function() {

          document.getElementById(
            "reviews-list"
          ).textContent =
            "Unable to load reviews.";

          delete window[callbackName];

        };


      document.body.appendChild(script);

    }


    /* ============================
       STAR RATING
       ============================ */

    const stars =
      document.querySelectorAll(
        "#star-rating span"
      );


    let selectedRating = 0;


    stars.forEach(star => {

      star.addEventListener(
        "mouseenter",
        function() {

          const rating =
            Number(this.dataset.rating);


          stars.forEach(s => {

            s.classList.toggle(
              "hover",
              Number(s.dataset.rating) <=
              rating
            );

          });

        }
      );


      star.addEventListener(
        "mouseleave",
        function() {

          stars.forEach(s =>
            s.classList.remove("hover")
          );


          stars.forEach(s => {

            s.classList.toggle(
              "selected",
              Number(s.dataset.rating) <=
              selectedRating
            );

          });

        }
      );


      star.addEventListener(
        "click",
        function() {

          selectedRating =
            Number(this.dataset.rating);


          stars.forEach(s => {

            s.classList.toggle(
              "selected",
              Number(s.dataset.rating) <=
              selectedRating
            );

          });

        }
      );

    });


    /* ============================
       SUBMIT REVIEW
       ============================ */

    const submitButton =
      document.getElementById(
        "submit-review"
      );


    submitButton.addEventListener(
      "click",
      async function() {

        const name =
          document
            .getElementById("review-name")
            .value
            .trim();


        const review =
          document
            .getElementById("review-text")
            .value
            .trim();


        const email =
          document
            .getElementById("review-email")
            .value
            .trim();


        const message =
          document.getElementById(
            "review-message"
          );


        if (!name) {

          message.textContent =
            "Please enter your name.";

          return;

        }


        if (selectedRating === 0) {

          message.textContent =
            "Please select a star rating.";

          return;

        }


        if (!review) {

          message.textContent =
            "Please write a review.";

          return;

        }


        submitButton.disabled = true;

        submitButton.textContent =
          "Submitting...";

        message.textContent = "";


        try {

          const response =
            await fetch(
              REVIEWS_URL,
              {
                method: "POST",

                body: JSON.stringify({
                  name: name,
                  rating: selectedRating,
                  review: review,
                  email: email
                })
              }
            );


          const result =
            await response.json();


          if (result.success) {

            message.textContent =
              "Thank you! Your review has been submitted.";


            document.getElementById(
              "review-name"
            ).value = "";


            document.getElementById(
              "review-text"
            ).value = "";


            document.getElementById(
              "review-email"
            ).value = "";


            selectedRating = 0;


            stars.forEach(s => {

              s.classList.remove(
                "selected",
                "hover"
              );

            });


            loadReviews();


          } else {

            message.textContent =
              "Something went wrong. Please try again.";

          }


        } catch (error) {

          console.error(error);

          message.textContent =
            "Something went wrong. Please try again.";

        }


        submitButton.disabled = false;

        submitButton.textContent =
          "Submit Review";

      }
    );


    /* ============================
       INITIAL LOAD
       ============================ */

    loadReviews();

  </script>

</body>

</html>
